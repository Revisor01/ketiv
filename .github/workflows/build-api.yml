name: Build API

on:
  push:
    branches: [main]
    paths:
      - 'api/**'
      - 'frontend/**'
      - 'scripts/**'
      - 'Dockerfile'
      - 'docker/**'
      - 'db/**'
      - '.github/workflows/build-api.yml'
  workflow_dispatch:

permissions:
  contents: read

# Beide Workflows rollen denselben Stack aus; nacheinander statt gleichzeitig.
concurrency:
  group: ketiv-deploy
  cancel-in-progress: false

jobs:
  image:
    uses: Revisor01/workflows/.github/workflows/docker-image.yml@5bb9fc1d9e2cd728029f334f50bbe355f005eef5 # 1.3.1
    permissions:
      contents: read
      packages: write
    with:
      image: ghcr.io/${{ github.repository }}-api
      node-version: "22"
      # Das API-Image liefert den Build von frontend/ als Startseite (public/) aus.
      vorbereitung: |
        cd frontend
        npm ci
        npm test
        REACT_APP_API_URL='${{ vars.REACT_APP_API_URL || 'https://ketiv.de' }}' npm run build
        rm -rf ../public
        cp -R build ../public

  deploy:
    needs: image
    uses: Revisor01/workflows/.github/workflows/portainer-deploy.yml@5bb9fc1d9e2cd728029f334f50bbe355f005eef5 # 1.3.1
    with:
      pruef-url: https://ketiv.de/
    secrets:
      webhook: ${{ secrets.PORTAINER_WEBHOOK }}
