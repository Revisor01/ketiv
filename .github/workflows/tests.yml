name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend tests
        working-directory: frontend
        run: |
          npm ci
          npm test

      - name: API syntax
        run: for f in api/*.php scripts/*.php tests/api/*.php; do php -l "$f"; done

      - name: API tests
        run: |
          php tests/api/admin_login_test.php
          php tests/api/api_key_test.php
          php tests/api/church_events_update_test.php
          php tests/api/tageslosung_test.php
