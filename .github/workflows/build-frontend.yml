name: Build Frontend

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/build-frontend.yml'
  workflow_dispatch:

permissions:
  contents: read

# Beide Workflows rollen denselben Stack aus; nacheinander statt gleichzeitig.
concurrency:
  group: ketiv-deploy
  cancel-in-progress: false

jobs:
  image:
    uses: Revisor01/workflows/.github/workflows/docker-image.yml@9eb921a3c730493b1aea79d5b22bf655356d5e43 # 1.2.0
    permissions:
      contents: read
      packages: write
    with:
      image: ghcr.io/${{ github.repository }}-frontend
      kontext: ./frontend
      build-args: |
        REACT_APP_API_URL=${{ vars.REACT_APP_API_URL || 'https://ketiv.de' }}

  deploy:
    needs: image
    uses: Revisor01/workflows/.github/workflows/portainer-deploy.yml@9eb921a3c730493b1aea79d5b22bf655356d5e43 # 1.2.0
    with:
      pruef-url: https://ketiv.de/
    secrets:
      webhook: ${{ secrets.PORTAINER_WEBHOOK }}
