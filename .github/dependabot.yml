# Haelt die gepinnten Actions, die npm-Pakete des Frontends und die
# Docker-Basisimages aktuell; je Oekosystem ein gesammelter PR pro Woche.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday, time: "06:00", timezone: Europe/Berlin }
    groups:
      actions:
        patterns: ["*"]
    commit-message: { prefix: ci }
  - package-ecosystem: npm
    directory: /frontend
    schedule: { interval: weekly, day: monday, time: "06:00", timezone: Europe/Berlin }
    groups:
      minor-und-patch:
        update-types: [minor, patch]
    commit-message: { prefix: chore, include: scope }
  - package-ecosystem: docker
    directories: ["/", "/frontend"]
    schedule: { interval: weekly, day: monday, time: "06:00", timezone: Europe/Berlin }
    commit-message: { prefix: chore }
